<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Halo -->
  <circle cx="256" cy="236" r="140" fill="url(#accentGrad)" opacity="0.22" />
  <circle cx="256" cy="236" r="120" fill="#0f766e" stroke="#fbbf24" stroke-width="5" stroke-dasharray="10 6" />

  <!-- US Initials Monogram -->
  <text x="256" y="210" font-family="'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="115" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">US</text>

  <!-- Sub Rupee Badge inside circle -->
  <rect x="216" y="270" width="80" height="44" rx="22" fill="url(#goldGrad)" />
  <text x="256" y="293" font-family="'Noto Sans', sans-serif" font-size="28" font-weight="900" fill="#042f2e" text-anchor="middle" dominant-baseline="middle">₹</text>

  <!-- Sound Waves (Left & Right) -->
  <path d="M 160 210 A 36 36 0 0 0 160 262" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" />
  <path d="M 136 190 A 66 66 0 0 0 136 282" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <path d="M 352 210 A 36 36 0 0 1 352 262" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" />
  <path d="M 376 190 A 66 66 0 0 1 376 282" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Bottom Brand Text: UDHAAR SATHI -->
  <text x="256" y="420" font-family="'Noto Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#2dd4bf" text-anchor="middle" letter-spacing="3">UDHAAR SATHI</text>
</svg>
